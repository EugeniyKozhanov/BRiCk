name: Build BRiCk

on:
  push:
    branches:
      - main
      - add_gtihub_ci
  pull_request:

jobs:
  Build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build . -f docker/Dockerfile.CI -t brick:latest

      - name: Test build cpp2v
        run: |
          docker run --rm brick:latest bash -c "eval \$(opam env) \
            && opam pin add --yes -n rocq-lens.dev /BRiCk/rocq-lens/ \
            && opam pin add --yes -n rocq-lens-elpi.dev /BRiCk/rocq-lens/ \
            && opam pin add --yes -n elpi-extra.dev /BRiCk/elpi-extra/ \
            && opam update \
            && opam install --yes --deps-only /BRiCk/rocq-bluerock-cpp2v \
            && eval \$(opam env) \
            && cd /BRiCk/rocq-bluerock-cpp2v \
            && dune build \
            && dune runtest "
